summary = "Engelsiz Mail"
description = "Engelsiz Mail is an accessible email add-on that enables NVDA users to read, compose, reply to, forward, organize, search, save, and manage email in Gmail through a keyboard-focused interface. It includes contacts, drafts, archives, attachments, notifications, offline caching, connection diagnostics, appearance settings, and other accessible email tools. (NVDA+Shift+M)"
